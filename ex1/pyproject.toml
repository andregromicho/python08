[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "loading"
version = "0.1.0"
description = "Matrix data loading and analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "matplotlib>=3.7.2",
]

[tool.mypy]
ignore_missing_imports = true